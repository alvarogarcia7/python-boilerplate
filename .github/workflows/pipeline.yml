name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'
        cache: 'pip'

    - name: Set up uv
      uses: astral-sh/setup-uv@v3
      with:
        enable-cache: true

    - name: Cache uv dependencies
      uses: actions/cache@v4
      with:
        path: .venv
        key: ${{ runner.os }}-uv-venv-${{ hashFiles('pyproject.toml', 'uv.lock') }}
        restore-keys: |
          ${{ runner.os }}-uv-venv-

    - name: Cache mypy
      uses: actions/cache@v4
      with:
        path: .mypy_cache
        key: ${{ runner.os }}-mypy-${{ hashFiles('pyproject.toml', 'uv.lock', 'mypy.ini', 'app/**', 'tests/**') }}
        restore-keys: |
          ${{ runner.os }}-mypy-

    - name: Cache pytest
      uses: actions/cache@v4
      with:
        path: .pytest_cache
        key: ${{ runner.os }}-pytest-${{ hashFiles('pyproject.toml', 'uv.lock', 'tests/**') }}
        restore-keys: |
          ${{ runner.os }}-pytest-

    - name: Install dependencies
      run: uv sync

    - name: Run tests
      run: make test

    - name: Run Typecheck
      run: make typecheck
